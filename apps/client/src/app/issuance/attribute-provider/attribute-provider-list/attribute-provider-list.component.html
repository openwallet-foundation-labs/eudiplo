<div fxLayout="row" fxLayoutAlign="space-between center">
  <h2 #listHeading tabindex="-1">Attribute Providers</h2>
  <button
    matIconButton
    [routerLink]="['create']"
    matTooltip="Create New Attribute Provider"
    aria-label="Create New Attribute Provider"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (loading) {
  <div class="list-state">
    <mat-spinner diameter="40" aria-label="Loading attribute providers"></mat-spinner>
  </div>
} @else if (loadError) {
  <app-load-error [message]="loadError" (retry)="loadItems()" />
} @else if (providers.length === 0) {
  <div class="list-state">
    <mat-icon class="empty-icon">dataset</mat-icon>
    <p>No attribute providers yet.</p>
    <a mat-flat-button [routerLink]="['create']">
      <mat-icon>add</mat-icon>
      Create Attribute Provider
    </a>
  </div>
} @else {
  <table mat-table [dataSource]="providers" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let provider">{{ provider.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let provider">{{ provider.name }}</td>
    </ng-container>

    <ng-container matColumnDef="url">
      <th mat-header-cell *matHeaderCellDef>URL</th>
      <td mat-cell *matCellDef="let provider">{{ provider.url }}</td>
    </ng-container>

    <ng-container matColumnDef="auth">
      <th mat-header-cell *matHeaderCellDef>Auth</th>
      <td mat-cell *matCellDef="let provider">{{ getAuthType(provider) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let provider">
        <button
          matIconButton
          [routerLink]="[provider.id]"
          matTooltip="View attribute provider"
          [attr.aria-label]="'View attribute provider ' + provider.id"
        >
          <mat-icon>visibility</mat-icon>
        </button>
        <button
          matIconButton
          [routerLink]="[provider.id, 'edit']"
          appConfigManaged
          managedKind="AttributeProvider"
          [managedResourceId]="provider.id"
          matTooltip="Edit attribute provider"
          [attr.aria-label]="'Edit attribute provider ' + provider.id"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
