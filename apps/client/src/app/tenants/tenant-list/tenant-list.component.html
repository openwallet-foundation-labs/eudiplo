<div fxLayout="row" fxLayoutAlign="space-between center">
  <h2>Tenants</h2>
  <button
    matIconButton
    [routerLink]="['create']"
    matTooltip="Create New Tenant"
    aria-label="Create tenant"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (loading) {
  <div class="list-state">
    <mat-spinner diameter="40" aria-label="Loading tenants"></mat-spinner>
  </div>
} @else if (loadError) {
  <app-load-error [message]="loadError" (retry)="loadTenants()" />
} @else if (tenants.length === 0) {
  <div class="list-state">
    <mat-icon class="empty-icon">domain</mat-icon>
    <p>No tenants yet.</p>
    <a mat-flat-button [routerLink]="['create']">
      <mat-icon>add</mat-icon>
      Create Tenant
    </a>
  </div>
} @else {
  <table mat-table [dataSource]="tenants" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let tenant">{{ tenant.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let tenant">{{ tenant.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let tenant">{{ tenant.description || 'No description' }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let tenant">{{ tenant.status }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let tenant">
        <button
          [routerLink]="tenant.id"
          matIconButton
          matTooltip="View details"
          [attr.aria-label]="'View tenant ' + tenant.id"
        >
          <mat-icon>visibility</mat-icon>
        </button>
        <button
          matIconButton
          (click)="deleteTenant(tenant)"
          matTooltip="Delete tenant"
          [attr.aria-label]="'Delete tenant ' + tenant.id"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
