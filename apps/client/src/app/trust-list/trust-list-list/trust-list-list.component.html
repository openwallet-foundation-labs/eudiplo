<div fxLayout="row" fxLayoutAlign="space-between center">
  <h2>Trust lists</h2>
  <div fxLayout="row" fxLayoutGap="8px">
    <button
      matIconButton
      [routerLink]="['create']"
      matTooltip="Create new Trust List"
      aria-label="Create trust list"
    >
      <mat-icon>add</mat-icon>
    </button>
  </div>
</div>

@if (loading) {
  <div class="list-state">
    <mat-spinner diameter="40" aria-label="Loading trust lists"></mat-spinner>
  </div>
} @else if (loadError) {
  <app-load-error [message]="loadError" (retry)="loadLists()" />
} @else if (lists.length === 0) {
  <div class="list-state">
    <mat-icon class="empty-icon">shield</mat-icon>
    <p>No trust lists yet.</p>
    <a mat-flat-button [routerLink]="['create']">
      <mat-icon>add</mat-icon>
      Create Trust List
    </a>
  </div>
} @else {
  <table mat-table [dataSource]="lists" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Trust List ID</th>
      <td mat-cell *matCellDef="let list">{{ list.id }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let list">{{ list.description }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let list">
        <button
          matIconButton
          [routerLink]="[list.id]"
          matTooltip="View details"
          [attr.aria-label]="'View trust list ' + list.id"
        >
          <mat-icon>visibility</mat-icon>
        </button>
        <button
          matIconButton
          [routerLink]="[list.id, 'edit']"
          matTooltip="Edit"
          appConfigManaged
          managedKind="TrustList"
          [managedResourceId]="list.id"
          [attr.aria-label]="'Edit trust list ' + list.id"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          matIconButton
          (click)="downloadConfig(list)"
          matTooltip="Download configuration"
          [attr.aria-label]="'Download the configuration of trust list ' + list.id"
        >
          <mat-icon>download</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
