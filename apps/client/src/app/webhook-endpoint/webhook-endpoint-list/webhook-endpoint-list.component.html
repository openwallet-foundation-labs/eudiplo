<div fxLayout="row" fxLayoutAlign="space-between center">
  <h2 #listHeading tabindex="-1">Webhook Endpoints</h2>
  <button
    matIconButton
    [routerLink]="['create']"
    matTooltip="Create New Webhook Endpoint"
    aria-label="Create New Webhook Endpoint"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>

@if (loading) {
  <div class="list-state">
    <mat-spinner diameter="40" aria-label="Loading webhook endpoints"></mat-spinner>
  </div>
} @else if (loadError) {
  <app-load-error [message]="loadError" (retry)="loadItems()" />
} @else if (endpoints.length === 0) {
  <div class="list-state">
    <mat-icon class="empty-icon">webhook</mat-icon>
    <p>No webhook endpoints yet.</p>
    <a mat-flat-button [routerLink]="['create']">
      <mat-icon>add</mat-icon>
      Create Webhook Endpoint
    </a>
  </div>
} @else {
  <table mat-table [dataSource]="endpoints" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let endpoint">{{ endpoint.id }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let endpoint">{{ endpoint.name }}</td>
    </ng-container>

    <ng-container matColumnDef="url">
      <th mat-header-cell *matHeaderCellDef>URL</th>
      <td mat-cell *matCellDef="let endpoint">{{ endpoint.url }}</td>
    </ng-container>

    <ng-container matColumnDef="auth">
      <th mat-header-cell *matHeaderCellDef>Auth</th>
      <td mat-cell *matCellDef="let endpoint">{{ getAuthType(endpoint) }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let endpoint">
        <button
          matIconButton
          [routerLink]="[endpoint.id]"
          [attr.aria-label]="'View webhook endpoint ' + endpoint.id"
        >
          <mat-icon>visibility</mat-icon>
        </button>
        <button
          matIconButton
          [routerLink]="[endpoint.id, 'edit']"
          appConfigManaged
          managedKind="WebhookEndpoint"
          [managedResourceId]="endpoint.id"
          [attr.aria-label]="'Edit webhook endpoint ' + endpoint.id"
        >
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
}
