# SonarQube Configuration for EUDIPLO
# Analyse the backend, the Web Client and the CLI (all three handle credentials)

sonar.projectKey=EUDIPLO_eudiplo
sonar.organization=eudiplo

# Source directories
sonar.sources=apps/backend/src,apps/client/src,apps/cli/src

# Coverage exclusions — focus coverage on the backend only
sonar.coverage.exclusions=apps/client/**,apps/cli/**

# Test directories (spec files also live next to the code in src/)
sonar.tests=apps/backend/src,apps/backend/test,apps/client/src,apps/cli/test
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Exclusions from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/generated/**,\
  **/*.gen.ts,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.e2e-spec.ts,\
  **/test/**,\
  **/fixtures/**,\
  **/database/migrations/**

# Exclusions from duplicate code detection (CPD)
sonar.cpd.exclusions=\
  **/test/**,\
  **/database/migrations/**,\
  **/*.gen.ts,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.e2e-spec.ts,\
  **/fixtures/**

# TypeScript configuration
sonar.typescript.tsconfigPaths=apps/backend/tsconfig.json,apps/client/tsconfig.app.json,apps/cli/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
